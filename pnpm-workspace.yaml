packages:
  - apps/*
  - packages/*
  - e2e

# Supply chain (FRM-REQ-009 neighbourhood; the policy set proven in D3 Auth Phase 5). A package
# published in the last seven days is not installed: most malicious releases are found and pulled
# inside that window. A dependency whose provenance gets *weaker* than an earlier release is
# refused, and so is a transitive dependency fetched from anywhere but the registry.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
# A takeover shows up as a *new* release, so only releases from the last 30 days are judged.
# Without a window, versions published long before a package adopted provenance are flagged for
# lacking it.
trustPolicyIgnoreAfter: 43200
blockExoticSubdeps: true

# pnpm 10 runs no dependency install scripts unless named, so each one here is a decision.
# Allowed, because the project does not work without them: argon2 builds or verifies its native
# binding (without it, hashing segfaults); esbuild installs the binary tsx and Vite run on;
# @prisma/engines fetches the schema engine migrations use.
onlyBuiltDependencies:
  - argon2
  - esbuild
  - '@prisma/engines'
# Refused, because nothing here needs them: prisma's own postinstall (the build runs
# `prisma generate` itself), and a donation notice.
ignoredBuiltDependencies:
  - prisma
  - core-js-pure

# One exact version is excused from the trust policy, with the evidence — the same finding D3 Auth
# recorded on 2026-09-16, re-verified here on 2026-09-17:
# prisma@7.10.0 — the CLI only — was published without the SLSA provenance 7.8.0 through 7.9.1
# carried. Its runtime packages at 7.10.0 (@prisma/client, adapter-pg, engines) all have it. Same
# publisher, and a pre-release that week named `integration-fix-prisma-publish-token` is still in
# the registry's version list. A publishing slip, not a takeover. 7.10.0 is also the newest stable
# release — 8.0.0 is still rc. Remove this line with the next Prisma upgrade: the policy should
# hold for every other version, this package included.
trustPolicyExclude:
  - prisma@7.10.0
