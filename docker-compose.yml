# No host ports anywhere. Ingress is the Cloudflare Tunnel overlay only.
# See docker-compose.tunnel.yml and docs/runbooks/deploy.md.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: foreman
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: foreman
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foreman"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Set here, not in .env: inside the network the database is `postgres:5432`, and /backups is
      # the only writable path in the image. A developer's .env points at the host instead.
      DATABASE_URL: postgresql://foreman:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/foreman
      BACKUP_DIR: /backups
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backups:/backups
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://foreman:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/foreman
      BACKUP_DIR: /backups
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/worker-heartbeat && find /tmp/worker-heartbeat -mmin -2 | grep -q ."]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  backups:
