<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="32" height="32" fill="none">
  <title>Foreman</title>
  <style>
    /* A favicon cannot read the page's CSS variables: the ink is the D3 light and dark --color-fg,
       fixed. The star is Foreman's lit star from d3cloud.io (DI-REQ-040) in both schemes. */
    .ink { stroke: #101117; }
    .joint { fill: #101117; }
    .star { fill: #F2937A; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #f0f2f7; }
      .joint { fill: #f0f2f7; }
    }
  </style>
  <g class="ink" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="32" r="26" />
    <path d="M32 12 L38 32 L32 52 L26 32 Z" />
  </g>
  <circle class="joint" cx="32" cy="52" r="3.4" />
  <circle class="star" cx="32" cy="12" r="5.5" />
</svg>
